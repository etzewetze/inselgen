name: InselGen
version: '${project.version}'
main: de.etzewetze.inselgen.InselGenPlugin
api-version: '1.21'
folia-supported: true
description: Zufällige Himmelsinseln mit Biomen, Vegetation, Seen, Erzen und Bossbar.
author: etzewetze
website: https://github.com/etzewetze/inselgen
softdepend: [FastAsyncWorldEdit, WorldEdit]
commands:
  skyinsel:
    description: Erzeugt eine natürliche Himmelsinsel an deiner Position.
    aliases: [inselgen]
    usage: /skyinsel <50-500> [Seed] [Stil] [biome:beach] [tree:palm] [trees:30] [plants:8] [lakes:1] [ores:true]
    permission: inselgen.generate
permissions:
  inselgen.export:
    description: Ausgewählte Bäume und Inseln als Vorlagen speichern.
    default: op
  inselgen.import:
    description: Vorlagen mit Vorschau importieren, verschieben und bestätigen.
    default: op
  inselgen.generate:
    description: Himmelsinseln erzeugen, Fortschritt abfragen und eigene Aufträge abbrechen.
    default: op
  inselgen.admin:
    description: Konfiguration neu laden und fremde Aufträge abbrechen.
    default: op
  inselgen.native:
    description: Native Platzierung ohne FAWE-Gebietsschutz benutzen (nur für vertrauenswürdige Builder).
    default: op
