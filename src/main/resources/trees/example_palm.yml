# Beispiel für eine eigene Baumvorlage: tree:example_palm
# Koordinaten relativ zum Stammfuß (0,0,0), direkt über dem Boden.
# Neue .yml-Dateien in plugins/InselGen/trees/ mit /skyinsel reload laden.
# Grenzen: X/Z -15 bis 15, Y 0 bis 63, maximal 4096 eindeutige Blöcke.
soil: [grass_block, dirt, sand, snow_block]
blocks:
  - {x: 0, y: 0, z: 0, block: 'minecraft:jungle_log[axis=y]'}
  - {x: 0, y: 1, z: 0, block: 'minecraft:jungle_log[axis=y]'}
  - {x: 0, y: 2, z: 0, block: 'minecraft:jungle_log[axis=y]'}
  - {x: 0, y: 3, z: 0, block: 'minecraft:jungle_log[axis=y]'}
  - {x: 0, y: 4, z: 0, block: 'minecraft:jungle_log[axis=y]'}
  - {x: 1, y: 4, z: 0, block: 'minecraft:jungle_log[axis=x]'}
  - {x: 1, y: 5, z: 0, block: 'minecraft:jungle_log[axis=y]'}
  - {x: 1, y: 6, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: 2, y: 6, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: 3, y: 5, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: 4, y: 4, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: 0, y: 6, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: -1, y: 5, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: -2, y: 4, z: 0, block: 'minecraft:jungle_leaves'}
  - {x: 1, y: 6, z: 1, block: 'minecraft:jungle_leaves'}
  - {x: 1, y: 5, z: 2, block: 'minecraft:jungle_leaves'}
  - {x: 1, y: 4, z: 3, block: 'minecraft:jungle_leaves'}
  - {x: 1, y: 6, z: -1, block: 'minecraft:jungle_leaves'}
  - {x: 1, y: 5, z: -2, block: 'minecraft:jungle_leaves'}
  - {x: 1, y: 4, z: -3, block: 'minecraft:jungle_leaves'}
