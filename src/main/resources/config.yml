# Die Größe ist die maximale horizontale Ausdehnung, kein Radius.
minimum-size: 50
maximum-size: 500

# auto: FAWE auf unterstützten Servern, ansonsten native Platzierung.
# Auf Folia wird immer die native Platzierung verwendet. Änderungen benötigen Neustart.
placement-backend: auto

# Verhindert das Überschreiben bestehender Blöcke im gesamten geplanten Bauvolumen.
# Auch Wasser, Pflanzen und Gebäude zählen als belegt. Nach der Prüfung können
# andere Plugins/Spieler den Bereich weiterhin verändern; nicht parallel bauen.
require-empty-space: true

# Obergrenze pro Insel, einschließlich Bäumen und Pflanzen.
maximum-blocks: 12000000

vegetation:
  trees: true
  plants: true
  # Anteil geeigneter Baumstandorte bzw. freier Grasblöcke in Prozent (0–100).
  tree-density: 30
  plant-density: 8
  # auto = passend zum Biom; alternativ palm, birch, spruce, ... oder eigener Dateiname.
  tree-type: auto

lakes:
  # 0 deaktiviert Seen. Bei ungeeignetem Gelände können weniger Seen entstehen.
  count: 1

ores:
  enabled: true
  # Anteil der unterirdischen Ader-Kandidaten (0–100), kein Anteil aller Blöcke.
  density: 35

# Nach Fertigstellung sicher auf die Mitte der Insel setzen, sofern du noch
# in derselben Welt bist. Der Bereich über der Inselmitte bleibt baumfrei.
teleport-after-generation: true

# Kleine Vorlagen werden vollständig dargestellt; große erhalten eine reduzierte
# Oberflächenvorschau und einen Rahmen. confirm setzt stets die komplette Vorlage.
# Änderungen dieser Vorschauoptionen benötigen einen Neustart.
preview:
  maximum-blocks: 4096
  timeout-seconds: 300
